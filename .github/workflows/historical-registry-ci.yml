name: Historical registry compatibility

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-generator:
    name: Windows generator setup
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/generator-requirements.txt
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
      - name: Generate pinned bindings with PowerShell
        shell: pwsh
        run: |
          ./scripts/generate.ps1
          git diff --check
          if (-not (Test-Path -LiteralPath src/vulkan.v -PathType Leaf)) {
            throw 'Vulkan bindings were not generated'
          }
          if (-not (Test-Path -LiteralPath src/vulkan_video.v -PathType Leaf)) {
            throw 'Vulkan Video bindings were not generated'
          }

  strict-v3-frontend:
    name: Strict V3 frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          ref: v1.4.362
          path: vulkandocs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          path: published
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: f59b886d2564e37d8626d715236fdfa928e13dda
          path: .ci-v-source
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: 4598bc7e4894c154b27391e4442005fff2fbbd68
          path: .ci-v-source/vc
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: d6e7ac1b1bcc98aed734a6ecbfa8509f24606c74
          path: .ci-v-source/thirdparty/tcc
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/generator-requirements.txt
      - name: Build pinned V3 compiler
        run: |
          make -C .ci-v-source local=1
          echo "$GITHUB_WORKSPACE/.ci-v-source" >> "$GITHUB_PATH"
          .ci-v-source/v version
      - name: Generate and type-check current bindings
        run: |
          set -euo pipefail
          python -m pip install --requirement .github/generator-requirements.txt
          python src/main.py -registry vulkandocs/xml/vk.xml vulkan.v
          python src/main.py -registry vulkandocs/xml/video.xml vulkan_video.v

          grep -F 'pub type StdVideoH264ScalingListsScalingList4x4Array' \
            src/vulkan_video.v
          if grep -E '^[[:space:]]+[A-Z][A-Za-z0-9_]*[[:space:]]+\[' \
            src/vulkan_video.v; then
            echo 'PascalCase fixed-array fields must use named array aliases' >&2
            exit 1
          fi

          install -m 0644 src/vulkan.v published/vulkan.v
          install -m 0644 src/vulkan_video.v published/vulkan_video.v
          install -d "$RUNNER_TEMP/vmodules/antono2"
          ln -s "$GITHUB_WORKSPACE/published" \
            "$RUNNER_TEMP/vmodules/antono2/vulkan"
          VMODULES="$RUNNER_TEMP/vmodules" v -new-compiler -check test/main.c.v

  generate-and-compile:
    name: Vulkan-Docs ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [v1.3.290, v1.4.319, v1.4.335, v1.4.362]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          ref: ${{ matrix.version }}
          path: vulkandocs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          path: published
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/generator-requirements.txt
      - run: python -m pip install --requirement .github/generator-requirements.txt
      - uses: NcStudios/VulkanCI@1a5db3ebde578c503b1d7f8df007e42a7367224c # v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Generate and compile historical bindings
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          echo "Compiler: $(v version)"
          ./scripts/generate.sh "$VERSION"
          install -m 0644 src/vulkan.v published/vulkan.v
          install -m 0644 src/vulkan_video.v published/vulkan_video.v
          printf '%s\n' "$VERSION" > published/VERSION
          install -d "$VULKAN_SDK/include/volk" "$HOME/.vmodules/antono2"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/zeux/volk/master/volk.h \
            --output "$VULKAN_SDK/include/volk/volk.h"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/zeux/volk/master/volk.c \
            --output "$VULKAN_SDK/include/volk/volk.c"
          ln -s "$GITHUB_WORKSPACE/published" "$HOME/.vmodules/antono2/vulkan"
          v -cc gcc run test

  required-checks:
    if: always()
    needs: [windows-generator, strict-v3-frontend, generate-and-compile]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify historical registry matrix
        env:
          WINDOWS_RESULT: ${{ needs.windows-generator.result }}
          V3_RESULT: ${{ needs.strict-v3-frontend.result }}
          MATRIX_RESULT: ${{ needs.generate-and-compile.result }}
        run: |
          test "$WINDOWS_RESULT" = success
          test "$V3_RESULT" = success
          test "$MATRIX_RESULT" = success

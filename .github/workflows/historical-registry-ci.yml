name: Historical registry compatibility

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  default-snapshot:
    name: Committed snapshot regeneration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Reproduce the committed API and its introductions
        run: v run scripts/check_historical_registry.vsh snapshot

  registry-generator-compat:
    name: Vulkan-Docs ${{ matrix.version }} generator interface
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [v1.4.363, v1.4.364, v1.4.368]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          ref: ${{ matrix.version }}
          path: vulkandocs
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Generate and format both bindings
        env:
          VERSION: ${{ matrix.version }}
        run: v run scripts/check_historical_registry.vsh registry "$VERSION"
      - name: Check out module support files for the opaque-pointer ABI probe
        if: matrix.version == 'v1.4.368'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          path: abi-modules/antono2/vulkan
      - name: Check out matching C headers
        if: matrix.version == 'v1.4.368'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ matrix.version }}
          path: abi-headers
      - name: Compile and run the generated opaque-pointer ABI probe
        if: matrix.version == 'v1.4.368'
        env:
          V_C_ERROR_BUG_REPORT_DISABLED: '1'
        run: v run scripts/check_historical_registry.vsh abi

  windows-generator:
    name: Windows generator setup
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Generate pinned bindings with PowerShell
        shell: pwsh
        run: v run scripts/check_historical_registry.vsh powershell

  strict-v3-frontend:
    name: Strict V3 frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          ref: v1.4.362
          path: vulkandocs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          path: published
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: efae23e85b3772a28e62884d554c1e88f91f52f4
          path: .ci-v-source
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: 2cbaf6bc2367937cd5f0b4ef923d1ef9aad613b3
          path: .ci-v-source/vc
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: d6e7ac1b1bcc98aed734a6ecbfa8509f24606c74
          path: .ci-v-source/thirdparty/tcc
          fetch-depth: 1
      - name: Build pinned V3 compiler
        run: make -C .ci-v-source local=1
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Generate and type-check current bindings
        run: v run scripts/check_historical_registry.vsh strict

  generate-and-compile:
    name: Vulkan-Docs ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [v1.3.290, v1.4.319, v1.4.335, v1.4.362]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          ref: ${{ matrix.version }}
          path: vulkandocs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          path: published
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - uses: NcStudios/VulkanCI@1a5db3ebde578c503b1d7f8df007e42a7367224c # v1.2
        env:
          # VulkanCI uses github.action_ref as its release artifact tag.
          VK_CI_TEST_TAG_OVERRIDE: v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Generate and compile historical bindings
        env:
          VERSION: ${{ matrix.version }}
        run: v run scripts/check_historical_registry.vsh historical "$VERSION"

  required-checks:
    if: always()
    needs: [default-snapshot, registry-generator-compat, windows-generator, strict-v3-frontend, generate-and-compile]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless the historical registry matrix passed
        if: >-
          always() && (
            needs.default-snapshot.result != 'success' ||
            needs.registry-generator-compat.result != 'success' ||
            needs.windows-generator.result != 'success' ||
            needs.strict-v3-frontend.result != 'success' ||
            needs.generate-and-compile.result != 'success'
          )
        run: exit 1

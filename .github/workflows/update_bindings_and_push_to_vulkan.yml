name: Propose Vulkan binding update

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      vk_docs_version:
        description: "Optional Vulkan-Docs tag (for example v1.4.362)"
        required: false
        type: string
      force_regenerate:
        description: "Regenerate the already-published registry tag after a generator fix"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: update-vulkan-bindings
  cancel-in-progress: false

env:
  DEPLOY_TARGET_REPO: antono2/vulkan

jobs:
  publisher-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - run: |
          v run scripts/publish_generated_branch.vsh --self-test
          v run scripts/open_generated_proposal.vsh --self-test
          v run scripts/select_registry_version.vsh --self-test
          v run scripts/stage_generated_release.vsh --self-test
          v run test/compatibility_workflow/check.vsh

  versions:
    needs: publisher-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.versions.outputs.requested }}
      changed: ${{ steps.versions.outputs.changed }}
      branch: ${{ steps.versions.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - id: versions
        env:
          REQUESTED_VERSION: ${{ inputs.vk_docs_version }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
          TARGET_VERSION_URL: https://raw.githubusercontent.com/antono2/vulkan/master/VERSION
        run: v run scripts/select_registry_version.vsh

  generate:
    needs: versions
    if: needs.versions.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.DEPLOY_TARGET_REPO }}
          path: published
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          path: vulkandocs
          ref: ${{ needs.versions.outputs.requested }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          path: vulkanheaders
          ref: ${{ needs.versions.outputs.requested }}
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Generate bindings
        run: |
          set -euo pipefail
          v run scripts/generate_core.vsh
          v run scripts/generate_video.vsh
          v fmt -w src/vulkan.v
          v fmt -w src/vulkan_video.v
          v run scripts/stage_generated_release.vsh prepare '${{ needs.versions.outputs.requested }}'
      - uses: NcStudios/VulkanCI@1a5db3ebde578c503b1d7f8df007e42a7367224c # v1.2
        env:
          # VulkanCI uses github.action_ref as its release artifact tag.
          VK_CI_TEST_TAG_OVERRIDE: v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Compile against the matching bundled headers and Volk
        run: |
          set -euo pipefail
          install -d "$HOME/.vmodules/antono2"
          v run scripts/stage_generated_release.vsh install-check
          ln -s "$GITHUB_WORKSPACE/published" "$HOME/.vmodules/antono2/vulkan"
          v -cc gcc run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v-vulkan-bindings-${{ needs.versions.outputs.requested }}
          if-no-files-found: error
          path: |
            src/vulkan.v
            src/vulkan_video.v
            VERSION
            REGISTRY_COMMIT
            published/c/vendor/include/vulkan/*.h
            published/c/vendor/include/vk_video/*.h

  propose:
    needs: [versions, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.DEPLOY_TARGET_REPO }}
          ref: master
          token: ${{ secrets.PUSH_VULKAN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: updater
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: v-vulkan-bindings-${{ needs.versions.outputs.requested }}
          path: generated
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Commit generated module to a release branch
        id: publish
        env:
          BRANCH_NAME: ${{ needs.versions.outputs.branch }}
        run: |
          set -euo pipefail
          v run updater/scripts/stage_generated_release.vsh install-proposal
          git diff --check
          git add vulkan.v vulkan_video.v VERSION REGISTRY_COMMIT \
            c/vendor/include/vulkan c/vendor/include/vk_video
          v run updater/scripts/publish_generated_branch.vsh \
            "$BRANCH_NAME" "Generated bindings ${{ needs.versions.outputs.requested }}"
      - name: Open pull request if missing
        env:
          BRANCH_NAME: ${{ needs.versions.outputs.branch }}
          GH_TOKEN: ${{ secrets.PUSH_VULKAN }}
          RELEASE_VERSION: ${{ needs.versions.outputs.requested }}
        run: v run updater/scripts/open_generated_proposal.vsh

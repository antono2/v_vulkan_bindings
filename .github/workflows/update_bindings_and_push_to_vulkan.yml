name: Propose Vulkan binding update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      vk_docs_version:
        description: "Optional Vulkan-Docs tag (for example v1.4.362)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-vulkan-bindings
  cancel-in-progress: false

env:
  DEPLOY_TARGET_REPO: antono2/vulkan

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.versions.outputs.requested }}
      changed: ${{ steps.versions.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: versions
        env:
          REQUESTED_VERSION: ${{ inputs.vk_docs_version }}
          TARGET_VERSION_URL: https://raw.githubusercontent.com/antono2/vulkan/master/VERSION
        run: |
          set -euo pipefail
          current=$(curl --fail --silent --show-error --location "$TARGET_VERSION_URL")
          requested=$REQUESTED_VERSION
          if [[ -z "$requested" ]]; then
            requested=$(curl --fail --silent --show-error --location \
              https://api.github.com/repos/KhronosGroup/Vulkan-Docs/tags | jq -er '.[0].name')
          fi
          [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid published version: $current" >&2
            exit 1
          }
          [[ "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid requested version: $requested" >&2
            exit 1
          }
          changed=true
          [[ "$current" == "$requested" ]] && changed=false
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Current: $current; requested: $requested; update required: $changed"

  generate:
    needs: versions
    if: needs.versions.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          path: vulkandocs
          ref: ${{ needs.versions.outputs.requested }}
      - uses: prantlf/setup-v-action@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/generator-requirements.txt
      - name: Install generator dependencies
        run: python -m pip install --requirement .github/generator-requirements.txt
      - name: Generate bindings
        run: |
          set -euo pipefail
          python src/main.py -registry vulkandocs/xml/vk.xml vulkan.v
          python src/main.py -registry vulkandocs/xml/video.xml vulkan_video.v
          v fmt -w src/vulkan.v
          v fmt -w src/vulkan_video.v
          printf '%s\n' '${{ needs.versions.outputs.requested }}' > VERSION
      - uses: NcStudios/VulkanCI@v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Download Volk and compile smoke test
        run: |
          set -euo pipefail
          install -d "$VULKAN_SDK/include/volk" "$HOME/.vmodules"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/zeux/volk/master/volk.h --output "$VULKAN_SDK/include/volk/volk.h"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/zeux/volk/master/volk.c --output "$VULKAN_SDK/include/volk/volk.c"
          ln -s "$GITHUB_WORKSPACE/src" "$HOME/.vmodules/vulkan"
          v -cc gcc run test
      - uses: actions/upload-artifact@v7
        with:
          name: v-vulkan-bindings-${{ needs.versions.outputs.requested }}
          if-no-files-found: error
          path: |
            src/vulkan.v
            src/vulkan_video.v
            VERSION

  propose:
    needs: [versions, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_TARGET_REPO }}
          ref: master
          token: ${{ secrets.PUSH_VULKAN }}
      - uses: actions/download-artifact@v8
        with:
          name: v-vulkan-bindings-${{ needs.versions.outputs.requested }}
          path: generated
      - name: Commit generated module to a release branch
        env:
          BRANCH_NAME: generated/${{ needs.versions.outputs.requested }}
        run: |
          set -euo pipefail
          test -f c/volk.c.v
          install -m 0644 generated/src/vulkan.v vulkan.v
          install -m 0644 generated/src/vulkan_video.v vulkan_video.v
          install -m 0644 generated/VERSION VERSION
          git diff --check
          git add vulkan.v vulkan_video.v VERSION
          git diff --cached --quiet && {
            echo "Generated files already match master"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generated bindings ${{ needs.versions.outputs.requested }}"

          remote_ref="refs/heads/$BRANCH_NAME"
          remote_sha=$(git ls-remote origin "$remote_ref" | awk '{print $1}')
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="$remote_ref:$remote_sha" origin "HEAD:$remote_ref"
          else
            git push origin "HEAD:$remote_ref"
          fi
      - name: Open or update pull request
        env:
          BRANCH_NAME: generated/${{ needs.versions.outputs.requested }}
          GH_TOKEN: ${{ secrets.PUSH_VULKAN }}
          RELEASE_VERSION: ${{ needs.versions.outputs.requested }}
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --repo "$DEPLOY_TARGET_REPO" \
            --base master \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Updated existing pull request #$existing"
            exit 0
          fi
          gh pr create \
            --repo "$DEPLOY_TARGET_REPO" \
            --base master \
            --head "$BRANCH_NAME" \
            --title "Generated bindings $RELEASE_VERSION" \
            --body "Automated bindings generated from KhronosGroup/Vulkan-Docs tag \`$RELEASE_VERSION\`. The release tag will be created after this pull request is merged and the target module passes its validation workflow."

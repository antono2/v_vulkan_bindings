name: Propose Vulkan binding update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      vk_docs_version:
        description: "Optional Vulkan-Docs tag (for example v1.4.362)"
        required: false
        type: string
      force_regenerate:
        description: "Regenerate the already-published registry tag after a generator fix"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: update-vulkan-bindings
  cancel-in-progress: false

env:
  DEPLOY_TARGET_REPO: antono2/vulkan

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.versions.outputs.requested }}
      changed: ${{ steps.versions.outputs.changed }}
      branch: ${{ steps.versions.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: versions
        env:
          REQUESTED_VERSION: ${{ inputs.vk_docs_version }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
          TARGET_VERSION_URL: https://raw.githubusercontent.com/antono2/vulkan/master/VERSION
        run: |
          set -euo pipefail
          current=$(curl --fail --silent --show-error --location "$TARGET_VERSION_URL")
          requested=$REQUESTED_VERSION
          if [[ -z "$requested" ]]; then
            requested=$(git ls-remote --tags --refs https://github.com/KhronosGroup/Vulkan-Docs.git \
              | awk -F/ '{print $NF}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)
          fi
          [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid published version: $current" >&2
            exit 1
          }
          [[ "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid requested version: $requested" >&2
            exit 1
          }
          if [[ "$(printf '%s\n%s\n' "$current" "$requested" | sort -V | head -n 1)" != "$current" ]]; then
            echo "Refusing to replace published registry $current with older $requested" >&2
            exit 1
          fi
          changed=true
          branch="generated/$requested"
          if [[ "$current" == "$requested" ]]; then
            changed=false
            if [[ "$FORCE_REGENERATE" == true ]]; then
              changed=true
              branch="compat/generated-$requested"
            fi
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Current: $current; requested: $requested; update required: $changed; branch: $branch"

  generate:
    needs: versions
    if: needs.versions.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.DEPLOY_TARGET_REPO }}
          path: published
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          path: vulkandocs
          ref: ${{ needs.versions.outputs.requested }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          path: vulkanheaders
          ref: ${{ needs.versions.outputs.requested }}
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/generator-requirements.txt
      - name: Install generator dependencies
        run: python -m pip install --requirement .github/generator-requirements.txt
      - name: Generate bindings
        run: |
          set -euo pipefail
          python src/main.py -registry vulkandocs/xml/vk.xml vulkan.v
          python src/main.py -registry vulkandocs/xml/video.xml vulkan_video.v
          v fmt -w src/vulkan.v
          v fmt -w src/vulkan_video.v
          printf '%s\n' '${{ needs.versions.outputs.requested }}' > VERSION
          git -C vulkanheaders rev-parse HEAD > REGISTRY_COMMIT
          grep -Eq '^[0-9a-f]{40}$' REGISTRY_COMMIT
          for directory in vulkan vk_video; do
            target="published/c/vendor/include/$directory"
            source="vulkanheaders/include/$directory"
            install -d "$target"
            find "$target" -maxdepth 1 -name '*.h' -delete
            find "$source" -maxdepth 1 -name '*.h' -exec cp -t "$target" {} +
          done
      - uses: NcStudios/VulkanCI@1a5db3ebde578c503b1d7f8df007e42a7367224c # v1.2
        env:
          # VulkanCI uses github.action_ref as its release artifact tag.
          VK_CI_TEST_TAG_OVERRIDE: v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Compile against the matching bundled headers and Volk
        run: |
          set -euo pipefail
          install -d "$HOME/.vmodules/antono2"
          install -m 0644 src/vulkan.v published/vulkan.v
          install -m 0644 src/vulkan_video.v published/vulkan_video.v
          ln -s "$GITHUB_WORKSPACE/published" "$HOME/.vmodules/antono2/vulkan"
          v -cc gcc run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v-vulkan-bindings-${{ needs.versions.outputs.requested }}
          if-no-files-found: error
          path: |
            src/vulkan.v
            src/vulkan_video.v
            VERSION
            REGISTRY_COMMIT
            published/c/vendor/include/vulkan/*.h
            published/c/vendor/include/vk_video/*.h

  propose:
    needs: [versions, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.DEPLOY_TARGET_REPO }}
          ref: master
          token: ${{ secrets.PUSH_VULKAN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: v-vulkan-bindings-${{ needs.versions.outputs.requested }}
          path: generated
      - name: Commit generated module to a release branch
        env:
          BRANCH_NAME: ${{ needs.versions.outputs.branch }}
        run: |
          set -euo pipefail
          test -f c/volk.c.v
          install -m 0644 generated/src/vulkan.v vulkan.v
          install -m 0644 generated/src/vulkan_video.v vulkan_video.v
          install -m 0644 generated/VERSION VERSION
          install -m 0644 generated/REGISTRY_COMMIT REGISTRY_COMMIT
          for directory in vulkan vk_video; do
            target="c/vendor/include/$directory"
            source="generated/published/c/vendor/include/$directory"
            find "$target" -maxdepth 1 -name '*.h' -delete
            cp "$source"/*.h "$target/"
          done
          git diff --check
          git add vulkan.v vulkan_video.v VERSION REGISTRY_COMMIT \
            c/vendor/include/vulkan c/vendor/include/vk_video
          git diff --cached --quiet && {
            echo "Generated files already match master"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generated bindings ${{ needs.versions.outputs.requested }}"

          remote_ref="refs/heads/$BRANCH_NAME"
          remote_sha=$(git ls-remote origin "$remote_ref" | awk '{print $1}')
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="$remote_ref:$remote_sha" origin "HEAD:$remote_ref"
          else
            git push origin "HEAD:$remote_ref"
          fi
      - name: Open or update pull request
        env:
          BRANCH_NAME: ${{ needs.versions.outputs.branch }}
          GH_TOKEN: ${{ secrets.PUSH_VULKAN }}
          RELEASE_VERSION: ${{ needs.versions.outputs.requested }}
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --repo "$DEPLOY_TARGET_REPO" \
            --base master \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Updated existing pull request #$existing"
            exit 0
          fi
          gh pr create \
            --repo "$DEPLOY_TARGET_REPO" \
            --base master \
            --head "$BRANCH_NAME" \
            --title "Generated bindings $RELEASE_VERSION" \
            --body "Automated bindings generated from KhronosGroup/Vulkan-Docs tag \`$RELEASE_VERSION\`. Once merged, this registry snapshot is available from the target module's master branch. Package release tags follow the semantic version in \`v.mod\` and are created separately."

name: Publish historical compatibility tags

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vulkan-compatibility-tags
  cancel-in-progress: false

env:
  TARGET_REPO: antono2/vulkan
  COMPATIBILITY_REVISION: "1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          fetch-depth: 0
          filter: blob:none
          path: vulkandocs
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          fetch-depth: 0
          path: published
          token: ${{ secrets.PUSH_VULKAN }}
      - uses: prantlf/setup-v-action@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/generator-requirements.txt
      - run: python -m pip install --requirement .github/generator-requirements.txt
      - uses: NcStudios/VulkanCI@v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Regenerate and validate every historical release
        id: regenerate
        run: |
          set -euo pipefail
          echo "Compiler: $(v version)"
          install -d "$VULKAN_SDK/include/volk" "$HOME/.vmodules/antono2"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/zeux/volk/master/volk.h \
            --output "$VULKAN_SDK/include/volk/volk.h"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/zeux/volk/master/volk.c \
            --output "$VULKAN_SDK/include/volk/volk.c"
          ln -s "$GITHUB_WORKSPACE/published" "$HOME/.vmodules/antono2/vulkan"
          git -C published config user.name "github-actions[bot]"
          git -C published config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t versions < <(
            git -C published tag --list --sort=version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'
          )
          current=$(cat published/VERSION)
          tag_refs=()
          for version in "${versions[@]}"; do
            [[ "$version" == "$current" ]] && continue
            compat_tag="$version+vcompat.$COMPATIBILITY_REVISION"
            if git -C published rev-parse --verify --quiet "refs/tags/$compat_tag" >/dev/null; then
              echo "Already published: $compat_tag"
              continue
            fi

            echo "Generating $compat_tag"
            git -C vulkandocs checkout --quiet --detach --force "refs/tags/$version"
            python src/main.py -registry vulkandocs/xml/vk.xml vulkan.v
            python src/main.py -registry vulkandocs/xml/video.xml vulkan_video.v
            v fmt -w src/vulkan.v
            v fmt -w src/vulkan_video.v

            git -C published switch --detach origin/master
            install -m 0644 src/vulkan.v published/vulkan.v
            install -m 0644 src/vulkan_video.v published/vulkan_video.v
            printf '%s\n' "$version" > published/VERSION
            git -C published diff --check
            git -C published add vulkan.v vulkan_video.v VERSION
            git -C published commit -m "Regenerate $version for current V"
            v -cc gcc -o "$RUNNER_TEMP/vulkan-smoke" test
            git -C published tag -a "$compat_tag" -m "$version bindings regenerated for current V"
            tag_refs+=("refs/tags/$compat_tag")
          done

          printf '%s\n' "${tag_refs[@]}" > "$RUNNER_TEMP/compat-tag-refs"
          echo "count=${#tag_refs[@]}" >> "$GITHUB_OUTPUT"
      - name: Publish compatibility tags atomically
        if: steps.regenerate.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.PUSH_VULKAN }}
        run: |
          set -euo pipefail
          mapfile -t tag_refs < "$RUNNER_TEMP/compat-tag-refs"
          git -C published push --atomic origin "${tag_refs[@]}"

name: Publish historical compatibility tags

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vulkan-compatibility-tags
  cancel-in-progress: false

env:
  TARGET_REPO: antono2/vulkan
  COMPATIBILITY_REVISION: "1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Docs
          fetch-depth: 0
          filter: blob:none
          path: vulkandocs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          fetch-depth: 0
          filter: blob:none
          path: vulkanheaders
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.TARGET_REPO }}
          fetch-depth: 0
          path: published
          token: ${{ secrets.PUSH_VULKAN }}
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
      - name: Regenerate and validate every historical release
        id: regenerate
        run: v run scripts/publish_compatibility_tags.vsh prepare "$RUNNER_TEMP/compat-tag-refs"
      - name: Publish compatibility tags atomically
        if: steps.regenerate.outputs.count != '0'
        run: v run scripts/publish_compatibility_tags.vsh push "$RUNNER_TEMP/compat-tag-refs"
